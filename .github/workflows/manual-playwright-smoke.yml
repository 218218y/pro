name: Manual Playwright Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-playwright-smoke-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  playwright-smoke:
    name: Playwright smoke (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Sync Three.js browser mirrors
        run: npm run three:sync-libs

      - name: Verify runner Chromium
        run: |
          test -x "$PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH"
          "$PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH" --version

      - name: Run Playwright smoke suite
        run: npm run e2e:smoke -- --shard=${{ matrix.shard }}/2

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: manual-playwright-smoke-diagnostics-shard-${{ matrix.shard }}-of-2
          path: |
            .artifacts/**
            test-results/**
            playwright-report/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
