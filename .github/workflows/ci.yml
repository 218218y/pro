name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_strict_gate:
        description: Run strict policy, formatting, and refactor guardrails
        required: false
        type: boolean
        default: true
      run_lint:
        description: Run strict lint
        required: false
        type: boolean
        default: true
      run_typecheck:
        description: Run all TypeScript checks
        required: false
        type: boolean
        default: true
      run_contracts:
        description: Run architecture and public-surface contracts
        required: false
        type: boolean
        default: true
      run_tests:
        description: Run runtime/unit tests
        required: false
        type: boolean
        default: true
      run_audit:
        description: Run release dependency audit
        required: false
        type: boolean
        default: false
      run_build_smoke:
        description: Run build and release-source smoke checks
        required: false
        type: boolean
        default: false
      run_release_gate:
        description: Run the full release verification gate with bundles
        required: false
        type: boolean
        default: false
      run_e2e:
        description: Run the Playwright smoke suite
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: true
  # Keep JavaScript actions on Node 24 consistently during GitHub's 2026 runner migration.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  strict-gate:
    name: Strict gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: github.event_name != 'workflow_dispatch' || inputs.run_strict_gate

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run migration policy gate
        run: npm run check:gate

      - name: Run changed-files format check
        if: github.event_name == 'pull_request'
        run: npm run format:base:check -- "${{ github.event.pull_request.base.sha }}"

      - name: Run full format check
        if: github.event_name != 'pull_request'
        run: npm run format:check

      - name: Run refactor guardrails
        run: npm run check:refactor-guardrails

      - name: Upload strict gate diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: strict-gate-diagnostics
          path: |
            .artifacts/**
            docs/*_AUDIT.*
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'workflow_dispatch' || inputs.run_lint

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run strict lint
        run: npm run lint

      - name: Upload lint diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: |
            .artifacts/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name != 'workflow_dispatch' || inputs.run_typecheck

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run canonical TypeScript checks
        run: npm run typecheck:all

      - name: Upload TypeScript diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: |
            .artifacts/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name != 'workflow_dispatch' || inputs.run_contracts

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run PDF template contract
        run: node tools/wp_pdf_template_check.js

      - name: Run layer contract
        run: npm run contract:layers

      - name: Enforce pending layer ratchet reductions
        run: npm run contract:layers:ratchet

      - name: Run public API contract
        run: npm run contract:api

      - name: Run UI contract
        run: npm run ui:contract

      - name: Run wiring guard
        run: npm run wiring:guard

      - name: Run UI DOM guard
        run: npm run ui:dom-guard

      - name: Run UI bindkey guard
        run: npm run ui:bindkey-guard

      - name: Run Three vendor contract
        run: npm run contract:three-vendor

      - name: Upload contract diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contract-diagnostics
          path: |
            .artifacts/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  runtime-tests:
    name: Runtime tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: github.event_name != 'workflow_dispatch' || inputs.run_tests
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run runtime tests
        run: npm run test -- --shard=${{ matrix.shard }}/3

      - name: Publish test failure summary
        if: success() || failure()
        run: |
          if [ -f .artifacts/test-report/failed-tests.md ]; then
            cat .artifacts/test-report/failed-tests.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-test-diagnostics-shard-${{ matrix.shard }}-of-3
          path: |
            .artifacts/**
            test-results/**
            playwright-report/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  test-runner-node-contract:
    name: Test Runner contract (Node 24 primary)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run primary Test Runner contracts
        run: node --test tests/wp_test_runner_command_runtime.test.js tests/wp_serial_tests_runtime.test.js

      - name: Check Test Runner tool syntax
        run: |
          node --check tools/wp_test_runner_command.mjs
          node --check tools/wp_run_tsx_tests.mjs
          node --check tools/wp_run_test_file_list.mjs
          node --check tools/wp_serial_tests.mjs

  node22-compat-contract:
    name: Node 22 compatibility contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22 compatibility runtime
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version-compat'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate Node runtime and ESNext floor
        run: |
          npm run check:node-runtime
          npm run check:esnext-target

      - name: Run Node 22 compatibility contracts
        run: node --test tests/wp_test_runner_command_runtime.test.js tests/wp_toolchain_version_policy_runtime.test.js tests/github_actions_ci_contracts.test.js

      - name: Check Test Runner tool syntax
        run: |
          node --check tools/wp_test_runner_command.mjs
          node --check tools/wp_run_tsx_tests.mjs
          node --check tools/wp_run_test_file_list.mjs
          node --check tools/wp_serial_tests.mjs

  build-smoke:
    name: Build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: github.event_name != 'workflow_dispatch' || inputs.run_build_smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run ESM build check
        run: npm run esm:check

      - name: Run Vite production build
        run: npm run vite:build

      - name: Run release parity source smoke
        run: npm run release:parity:source

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-smoke-diagnostics
          path: |
            .artifacts/**
            dist/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  audit:
    name: Release dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'workflow_dispatch' || inputs.run_audit

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install release dependencies
        run: npm ci --ignore-scripts --omit=dev

      - name: Audit high severity release dependencies
        run: npm run audit:release

  required-checks:
    name: Required checks
    runs-on: ubuntu-latest
    if: always() && github.event_name != 'workflow_dispatch'
    needs:
      - strict-gate
      - lint
      - typecheck
      - contracts
      - runtime-tests
      - test-runner-node-contract
      - node22-compat-contract
      - build-smoke
      - audit
      - e2e-critical

    steps:
      - name: Summarize required checks
        env:
          STRICT_GATE_RESULT: ${{ needs['strict-gate'].result }}
          LINT_RESULT: ${{ needs['lint'].result }}
          TYPECHECK_RESULT: ${{ needs['typecheck'].result }}
          CONTRACTS_RESULT: ${{ needs['contracts'].result }}
          RUNTIME_TESTS_RESULT: ${{ needs['runtime-tests'].result }}
          TEST_RUNNER_NODE_CONTRACT_RESULT: ${{ needs['test-runner-node-contract'].result }}
          NODE22_COMPAT_CONTRACT_RESULT: ${{ needs['node22-compat-contract'].result }}
          BUILD_SMOKE_RESULT: ${{ needs['build-smoke'].result }}
          AUDIT_RESULT: ${{ needs['audit'].result }}
          E2E_CRITICAL_RESULT: ${{ needs['e2e-critical'].result }}
        run: |
          failed=0
          for check in \
            "strict-gate:$STRICT_GATE_RESULT" \
            "lint:$LINT_RESULT" \
            "typecheck:$TYPECHECK_RESULT" \
            "contracts:$CONTRACTS_RESULT" \
            "runtime-tests:$RUNTIME_TESTS_RESULT" \
            "test-runner-node-contract:$TEST_RUNNER_NODE_CONTRACT_RESULT" \
            "node22-compat-contract:$NODE22_COMPAT_CONTRACT_RESULT" \
            "build-smoke:$BUILD_SMOKE_RESULT" \
            "audit:$AUDIT_RESULT" \
            "e2e-critical:$E2E_CRITICAL_RESULT"
          do
            name="${check%%:*}"
            result="${check#*:}"
            echo "- $name: $result" >> "$GITHUB_STEP_SUMMARY"
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          exit "$failed"

  e2e-critical:
    name: Playwright critical PR lane
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name != 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Sync Three.js browser mirrors
        run: npm run three:sync-libs

      - name: Install Playwright Chromium
        run: npm run e2e:install -- chromium --with-deps

      - name: Run critical browser journeys
        run: npm run e2e:critical

      - name: Upload critical E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-critical-diagnostics
          path: |
            .artifacts/**
            test-results/**
            playwright-report/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  release-gate:
    name: Full release gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name == 'workflow_dispatch' && inputs.run_release_gate

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit high severity release dependencies
        run: npm run audit:release

      - name: Run full release verification gate
        run: npm run gate:full

      - name: Publish test failure summary
        if: success() || failure()
        run: |
          if [ -f .artifacts/test-report/failed-tests.md ]; then
            cat .artifacts/test-report/failed-tests.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload release gate diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-diagnostics
          path: |
            .artifacts/**
            test-results/**
            playwright-report/**
            dist/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  e2e-smoke:
    name: Playwright smoke (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Sync Three.js browser mirrors
        run: npm run three:sync-libs

      - name: Install Playwright Chromium
        run: npm run e2e:install -- chromium --with-deps

      - name: Run Playwright smoke suite
        run: npm run e2e:smoke -- --shard=${{ matrix.shard }}/2

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-diagnostics-shard-${{ matrix.shard }}-of-2
          path: |
            .artifacts/**
            test-results/**
            playwright-report/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
