name: Manual Closeout Verification

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Closeout profile to run
        required: true
        type: choice
        default: verify-core
        options:
          - verify-core
          - control-plane
          - order-pdf
          - sketch
          - cloud-sync
          - e2e
          - browser-evidence
          - verify
          - default
      trace_deprecations:
        description: Include Node deprecation stacks in action and tool logs
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: manual-closeout-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CI: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  closeout:
    name: Closeout profile
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
      NODE_OPTIONS: ${{ inputs.trace_deprecations && '--trace-deprecation' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Sync Three.js browser mirrors
        run: npm run three:sync-libs
      - name: Verify runner Chromium
        run: |
          test -x "$PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH"
          "$PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH" --version
      - name: Reset closeout checkpoint
        run: npm run verify:closeout -- --reset-state
      - name: Run closeout profile
        run: node tools/wp_run_closeout_profile.cjs "${{ inputs.profile }}"
      - name: Validate final verification evidence
        if: success() && inputs.profile == 'default'
        run: npm run check:verification-summary
      - name: Publish closeout summary
        if: success() || failure()
        run: |
          if [ "${{ inputs.profile }}" = "default" ] && [ "${{ job.status }}" = "success" ]; then
            cat docs/FINAL_VERIFICATION_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Closeout profile: ${{ inputs.profile }}" >> "$GITHUB_STEP_SUMMARY"
            echo "Focused profiles publish diagnostics/state artifacts instead of reusing a checked-in final summary." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload final verification evidence
        if: success() && inputs.profile == 'default'
        uses: actions/upload-artifact@v4
        with:
          name: final-verification
          path: docs/FINAL_VERIFICATION_SUMMARY.*
          if-no-files-found: error
          retention-days: 14
      - name: Upload closeout diagnostics
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: closeout-diagnostics
          path: |
            .artifacts/closeout-state.json
            .artifacts/closeout-logs/**
            .artifacts/test-report/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
