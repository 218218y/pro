    <noscript>צריך להפעיל JavaScript כדי להריץ את WardrobePro.</noscript>

    <!-- Release bundle loader (STRICT):
         We load ONLY the generated Three vendor bundle.
         No fallback.
         This ensures release visuals match the vendor bundle exactly, and we immediately know
         if the vendor is missing / incomplete. -->
    <script type="module">
      (function () {
        function moduleAssetUrl(rel) {
          try {
            return new URL(rel, import.meta.url).toString();
          } catch (_) {
            return String(rel || '');
          }
        }

        function isHtmlContentType(contentType) {
          return /(?:^|;)\s*(?:text\/html|application\/xhtml\+xml)(?:\s*;|$)/i.test(
            String(contentType || '')
          );
        }

        function createRecoverableAssetError(rel, response, contentType) {
          const status = response && response.status ? response.status : 0;
          const url = moduleAssetUrl(rel);
          const err = new TypeError(
            'Release module asset is not available as JavaScript: ' +
              url +
              ' status=' +
              status +
              ' content-type=' +
              String(contentType || '')
          );
          err.recoverableAsset = true;
          err.assetUrl = url;
          err.assetStatus = status;
          err.assetContentType = String(contentType || '');
          return err;
        }

        async function probeModuleAsset(rel) {
          if (typeof fetch !== 'function') return;
          const url = moduleAssetUrl(rel);
          let response;
          try {
            response = await fetch(url, { cache: 'no-store', credentials: 'same-origin' });
          } catch (err) {
            if (err && typeof err === 'object') {
              err.recoverableAsset = true;
              err.assetUrl = url;
            }
            throw err;
          }
          const contentType = response && response.headers ? response.headers.get('content-type') || '' : '';
          if (!response || !response.ok || isHtmlContentType(contentType)) {
            throw createRecoverableAssetError(rel, response, contentType);
          }
        }

        function extractFailedModuleUrl(err) {
          const text = String((err && (err.message || err.stack)) || err || '');
          const match = text.match(/https?:\/\/[^\s"'<>]+\.js(?:\?[^\s"'<>]*)?/i);
          return match ? match[0] : '';
        }

        function isRecoverableModuleFailure(err) {
          if (err && err.recoverableAsset) return true;
          const text = String((err && (err.message || err.stack)) || err || '');
          return /Failed to fetch dynamically imported module|Importing a module script failed|Expected a JavaScript(?:-or-Wasm)? module script|Release module asset is not available as JavaScript/i.test(
            text
          );
        }

        function recoverStaleAsset(errOrUrl, reason) {
          const assetUrl =
            typeof errOrUrl === 'string'
              ? errOrUrl
              : (errOrUrl && errOrUrl.assetUrl) || extractFailedModuleUrl(errOrUrl);
          try {
            if (typeof window.__WP_RECOVER_FROM_STALE_ASSET__ === 'function') {
              window.__WP_RECOVER_FROM_STALE_ASSET__(assetUrl || '', reason || 'loader-module');
              return true;
            }
          } catch (_) {}
          try {
            const u = new URL(location.href);
            u.searchParams.set('v', String(Date.now()));
            u.searchParams.set('wp_reload', String(reason || 'loader-module'));
            if (assetUrl) u.searchParams.set('missing_asset', assetUrl.split('/').pop() || 'module');
            location.replace(u.toString());
            return true;
          } catch (_) {
            try {
              location.reload();
              return true;
            } catch (__) {
              return false;
            }
          }
        }

        function showFatalOverlay(title, err) {
          try {
            console.error('[WP LOADER]', title, err);
          } catch (_) {}
          const overlay = document.createElement('div');
          overlay.style.cssText = [
            'position:fixed',
            'inset:0',
            'z-index:999999',
            'display:flex',
            'align-items:center',
            'justify-content:center',
            'background:#0b1220',
            'color:#fff',
            'padding:24px',
            'font-family:Heebo,Arial,sans-serif',
            'text-align:center',
          ].join(';');

          const safe = s =>
            String(s || '').replace(/[<>&]/g, ch => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' })[ch]);

          overlay.innerHTML = `
            <div style="max-width:920px;line-height:1.7">
              <div style="font-size:22px;font-weight:800;margin-bottom:10px">שגיאת טעינה: ${safe(title)}</div>
              <div style="opacity:.9;margin-bottom:14px">
                לא הצלחנו לטעון את ספריות Three.js (vendor) כ־<b>ESM</b> — או שה־boot נכשל.
              </div>
              <div style="text-align:right;background:rgba(255,255,255,.08);padding:14px 16px;border-radius:14px">
                <div style="font-weight:800;margin-bottom:8px">בדיקה מהירה:</div>
                <ol style="margin:0;padding-right:18px">
                  <li>ב־<b>release</b> צריך להיות הקובץ:</li>
                  <li style="list-style:none;margin:8px 0 0 0">
                    <div dir="ltr" style="background:rgba(0,0,0,.35);padding:10px 12px;border-radius:12px;display:inline-block">
                      libs/three.vendor.js
                    </div>
                  </li>
                  <li style="margin-top:10px">פתח קונסול כדי לראות מה חסר/נכשל</li>
                  <li style="margin-top:8px">אם זה קרה אחרי העלאה מחדש — זה בדרך כלל HTML ישן שמצביע לקובץ JS שכבר לא קיים.</li>
                </ol>
                <button type="button" data-wp-recover style="cursor:pointer;border:0;padding:10px 14px;border-radius:12px;font-weight:800;margin-top:12px">
                  טען גרסה נקייה עכשיו
                </button>
                <div style="margin-top:10px;opacity:.85;font-size:13px">
                  טיפ: אם אתה על נטפרי/פילטר — לפעמים קבצי JS מוחלפים בעמוד חסימה (HTML). במקרה כזה חייבים קבצים מקומיים תקינים.
                </div>
              </div>
            </div>
          `;
          document.body.appendChild(overlay);
          try {
            const btn = overlay.querySelector('[data-wp-recover]');
            if (btn) btn.addEventListener('click', () => recoverStaleAsset(err, 'fatal-overlay'));
          } catch (_) {}
        }

        async function loadThreeVendor() {
          await probeModuleAsset('./libs/three.vendor.js');
          const mod = await import('./libs/three.vendor.js');
          const THREE =
            mod && mod.THREE ? mod.THREE : mod && mod.default && mod.default.THREE ? mod.default.THREE : null;
          if (!THREE) throw new Error('three.vendor.js loaded but missing export: THREE');

          // Strict sanity-check:
          // If the vendor bundle is missing key constants/exports, release visuals can drift.
          // Fail fast with a clear error.
          const required = [
            'WebGLRenderer',
            'SRGBColorSpace',
            // tone mapping is optional (we accept either constant), but at least one must exist
          ];
          const missing = required.filter(k => !(k in THREE));
          if (!('NeutralToneMapping' in THREE) && !('ACESFilmicToneMapping' in THREE)) {
            missing.push('NeutralToneMapping|ACESFilmicToneMapping');
          }
          if (missing.length) {
            throw new Error('three.vendor.js is missing required exports: ' + missing.join(', '));
          }

          return THREE;
        }

        async function boot() {
          try {
            const THREE = await loadThreeVendor();
            await probeModuleAsset('./wardrobepro.bundle.js');
            const { boot } = await import('./wardrobepro.bundle.js');

            // Required canonical runtime config module:
            //   export default { config?: { ... }, flags?: { ... } };
            async function loadRuntimeModule() {
              const url = new URL('./wp_runtime_config.mjs', import.meta.url).toString();
              const mod = await import(url);
              if (!mod || typeof mod !== 'object' || !('default' in mod)) {
                throw new Error('wp_runtime_config.mjs must have a default export');
              }
              const raw = mod.default;
              if (!raw || typeof raw !== 'object' || Array.isArray(raw)) {
                throw new Error('wp_runtime_config.mjs default export must be an object');
              }
              const unexpectedKeys = Object.keys(raw).filter(key => key !== 'flags' && key !== 'config');
              if (unexpectedKeys.length) {
                throw new Error(
                  'wp_runtime_config.mjs has unexpected top-level key(s): ' + unexpectedKeys.join(', ')
                );
              }
              if (
                typeof raw.flags !== 'undefined' &&
                (raw.flags === null || typeof raw.flags !== 'object' || Array.isArray(raw.flags))
              ) {
                throw new Error('wp_runtime_config.mjs flags must be an object');
              }
              if (
                typeof raw.config !== 'undefined' &&
                (raw.config === null || typeof raw.config !== 'object' || Array.isArray(raw.config))
              ) {
                throw new Error('wp_runtime_config.mjs config must be an object');
              }
              return { config: raw.config || {}, flags: raw.flags || {} };
            }

            const runtime = await loadRuntimeModule();
            const flags = runtime.flags;
            const config = Object.assign(
              {
                cacheBudgetMb: 128,
                cacheMaxItems: 2000,
                debugBootTimings: false,
              },
              runtime.config
            );

            // Pure-ESM DI: inject browser env for modules that require window/document.
            const app = await boot({
              deps: {
                THREE,
                flags,
                config,
                browser: {
                  window,
                  document,
                  location: window.location,
                  navigator: window.navigator,
                },
              },
            });

            if (!app) throw new Error('ESM boot failed: app is null/undefined');
          } catch (err) {
            if (isRecoverableModuleFailure(err) && recoverStaleAsset(err, 'boot-module')) return;
            showFatalOverlay('Boot', err);
          }
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
        else boot();
      })();
    </script>
  </body>
